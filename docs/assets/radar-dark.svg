<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-label="Tech radar: stack usado por Fermín Vicente">
  <defs>
    <linearGradient id="pan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1322"/><stop offset="1" stop-color="#0A1020"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4FD8C4" stop-opacity="0"/>
      <stop offset="1" stop-color="#4FD8C4" stop-opacity=".28"/>
    </linearGradient>
    <style>
      .b text, .b circle { opacity: .34; }
      .b { animation: wake 12s linear infinite; }
      .ping { animation: ping 12s linear infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes wake { 0% { opacity:.42 } 2% { opacity:1 } 26% { opacity:.92 } 70% { opacity:.5 } 100% { opacity:.42 } }
      @keyframes ping { 0% { opacity:0; transform:scale(1) } 3% { opacity:.9 } 16% { opacity:0; transform:scale(2.6) } 100% { opacity:0; transform:scale(2.6) } }
      @media (prefers-reduced-motion: reduce) { .b, .ping, .sw { animation: none } .b { opacity: 1 } }
    </style>
  </defs>
  <rect width="900" height="700" rx="20" fill="url(#pan)"/>
  <rect x="0.75" y="0.75" width="898.5" height="698.5" rx="20" fill="none" stroke="#1B2740"/>
  <text x="34" y="40" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#5A6D8C">~ $ fer radar --stack</text>

